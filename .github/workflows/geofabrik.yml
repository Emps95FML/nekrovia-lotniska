name: Lotniska z Geofabrik (szybko)

# Caly swiat naraz: 9 zadan (kontynenty) sciaga paczki krajow z Geofabrik, wycina obiekty lotniskowe (osmium),
# ostatnie zadanie sklada pliki lotnisk i zapisuje je w repozytorium (GitHub Pages).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wytnij:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        kontynent: [europe, asia, africa, north-america, central-america, south-america, australia-oceania, russia, antarctica]
    steps:
      - uses: actions/checkout@v4
      - name: Miejsce na dysku i osmium
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          df -h /
      - name: Wytnij obiekty lotniskowe
        run: |
          mkdir -p wyciete paczki
          python regiony.py ${{ matrix.kontynent }} > lista.txt
          echo "Paczek: $(wc -l < lista.txt)"
          while read -r url; do
            nazwa=$(basename "$url" .osm.pbf)
            echo "== $nazwa"
            curl -sSfL --retry 5 --retry-delay 20 -o paczki/r.osm.pbf "$url" || { echo "!! nie pobrano $url"; continue; }
            osmium tags-filter paczki/r.osm.pbf nwr/aeroway -o paczki/a.osm.pbf --overwrite
            osmium export paczki/a.osm.pbf -c osmium-eksport.json -f geojsonseq -x print_record_separator=false \
              -o wyciete/${{ matrix.kontynent }}-$nazwa.geojsonseq --overwrite
            rm -f paczki/*.pbf
          done < lista.txt
          ls -la wyciete | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: wyciete-${{ matrix.kontynent }}
          path: wyciete/
          retention-days: 3

  zloz:
    needs: wytnij
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: wyciete-*
          path: wyciete
          merge-multiple: true
      - name: Zloz pliki lotnisk
        run: python zloz.py "wyciete/*.geojsonseq"
      - name: Paczka calego swiata (jeden plik do pobrania w aplikacji)
        run: |
          mkdir -p swiat && rm -f swiat/lotniska.zip
          cd osm && zip -0 -q ../swiat/lotniska.zip *.json.gz _postep.json && cd ..
          ls -la swiat
      - name: Zapisz w repozytorium
        run: |
          git config user.name "nekrovia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A osm swiat
          git commit -qm "Lotniska OSM z Geofabrik: caly swiat" || exit 0
          git pull --rebase -q || true
          git push
