name: Pobieranie lotnisk z OSM

# paczka co 3 godziny (i recznie z zakladki Actions), az caly swiat bedzie pobrany
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: pobieranie-lotnisk
  cancel-in-progress: false

jobs:
  pobierz:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz paczke lotnisk
        env:
          LIMIT_S: "17000"
        run: python pobierz.py
      - name: Zapisz wynik
        if: always()
        run: |
          git config user.name "nekrovia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A osm postep
          git commit -m "Lotniska OSM: kolejna paczka" || exit 0
          git pull --rebase
          git push
